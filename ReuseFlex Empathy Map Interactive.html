<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReuseFlex: Empathy Map, Interactive</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--paper:#F4F2EA;--ink:#22231F;--bg:#F4F2EA;--fg:#22231F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#22231F;--ink:#F4F2EA}}
:root[data-theme="dark"]{--paper:#22231F;--ink:#F4F2EA}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'DM Sans',system-ui,sans-serif;transition:background .7s,color .7s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10;transition:background .7s}
button{font-family:inherit}
.top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 12px) clamp(14px,3vw,40px) 12px;color:var(--fg)}
.logo{height:34px;width:auto;flex:none;border-radius:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:center;padding:2px}
.tab,.pb{font:600 14px 'Outfit',sans-serif;padding:9px 15px;min-height:44px;border-radius:99px;border:1.5px solid currentColor;background:none;color:inherit;opacity:.72;cursor:pointer;white-space:nowrap;transition:background .3s,color .3s,opacity .3s,transform .2s}
.tab:hover{opacity:1;transform:translateY(-2px)}
.tab[aria-current="true"]{background:var(--fg);color:var(--bg);opacity:1}
.pb{background:var(--fg);color:var(--bg);opacity:1;flex:none}
.prog{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--fg)}
.scene{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;overflow-y:auto;overflow-x:hidden;background:var(--sbg);color:var(--sfg);padding:calc(env(safe-area-inset-top,0px) + 92px) clamp(16px,4vw,56px) calc(env(safe-area-inset-bottom,0px) + 28px)}
.scene.active{display:flex}
.wrap{width:min(100%,1500px);display:flex;flex-direction:column;gap:22px;flex:1}
.kick{font:600 15px 'Outfit',sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
h1,h2{margin:0;font:700 clamp(40px,7vw,96px)/1.02 'Outfit',sans-serif;letter-spacing:-.02em}
.w{display:inline-block;white-space:nowrap}
.ch{display:inline-block;opacity:0}
.in .ch{animation:rise .65s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--d)*35ms + 150ms)}
.pill{align-self:flex-start;background:#CBBEE9;color:#22231F;font:600 16px 'Outfit',sans-serif;padding:8px 18px;border-radius:99px}
.cards{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:clamp(10px,1.6vw,20px)}
.card{opacity:0}
.in .card{animation:pop .75s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i)*110ms + 350ms)}
.cbtn{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;border-radius:12%}
.cbtn:focus-visible{outline:3px solid currentColor;outline-offset:4px}
.float{display:block;animation:float 5s ease-in-out infinite alternate;animation-delay:var(--fd)}
.tilt{display:block;position:relative;transition:transform .25s cubic-bezier(.2,.8,.2,1);transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1))}
.tilt img{display:block;width:100%;height:auto;filter:drop-shadow(0 12px 22px rgba(0,0,0,.2))}
.glare{position:absolute;inset:0;border-radius:11%;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.4),transparent 55%)}
.cbtn:hover .glare{opacity:1}
.resp{margin-top:auto;display:flex;gap:18px;align-items:center;flex-wrap:wrap;border-radius:22px;padding:18px 26px;background:var(--rbg);color:var(--rfg);font-size:clamp(16px,1.6vw,22px);line-height:1.35;opacity:0}
.in .resp{animation:up .8s cubic-bezier(.2,.9,.2,1) both;animation-delay:1.5s}
.resp b{font:700 14px 'Outfit',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--rac)}
.resp em{font-style:normal;font-weight:700;color:var(--rac)}
.hint{font-size:16px;opacity:.75}
.lb{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(20,20,18,.72);backdrop-filter:blur(8px);padding:24px}
.lb[hidden]{display:none}
.lbin{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:min(92vw,560px);color:#F4F2EA;text-align:center}
.lbin img{width:100%;max-height:68vh;object-fit:contain;filter:drop-shadow(0 20px 40px rgba(0,0,0,.4))}
.lbin p{margin:0;font-size:18px;line-height:1.4}
.lbc{display:flex;gap:10px}
.lbc button{min-width:44px;min-height:44px;padding:0 18px;border-radius:99px;border:1.5px solid #F4F2EA;background:none;color:#F4F2EA;font:600 15px 'Outfit',sans-serif;cursor:pointer}
.lbc button:hover{background:#F4F2EA;color:#22231F}
@keyframes rise{from{opacity:0;transform:translateY(70%) rotate(7deg)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(70px) scale(.82) rotate(-3deg)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes float{to{transform:translateY(-8px)}}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.logo{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.ch,.card,.resp{opacity:1}}
</style>
</head>

const DARK={rbg:"#CBBEE9",rfg:"#22231F",rac:"#22231F"},INK={rbg:"#22231F",rfg:"#F4F2EA",rac:"#CBF55C"};
const S=[
{k:"Empathy map · visuals",tab:"Overview",t:"The Status-Driven Overconsumer",bg:"var(--paper)",fg:"var(--ink)",ov:true,c:["Says","Thinks","Does","Feels","Pains","Gains"]},
{k:"01 — What they say",tab:"Says",t:"What they say.",bg:"#CBBEE9",fg:"#22231F",...INK,i:"s",r:"People say reuse is fine but won’t do it themselves, so ReuseFlex rewards the action, not the opinion.",c:["“I don’t really care about trends.” (while owning the trending item)","“I’ll wear it again… but not to this wedding.”","“It was on sale, so I basically saved money.”","“Second-hand is great, I just wouldn’t buy it myself.”","“I only added that to get free delivery.”"]},
{k:"02 — What they think",tab:"Thinks",t:"What they think.",bg:"#22231E",fg:"#F4F2EA",...DARK,i:"t",r:"Fear of judgment drives buying, so friend circles make keeping things the normal, approved choice.",c:["What will people say if I repeat this outfit?","If I don’t upgrade, will I look like I can’t afford it?","Everyone already has this, so I’ll be left out.","Repairing is a hassle and costs almost as much as a new one.","One more purchase won’t matter."]},
{k:"03 — What they do",tab:"Does",t:"What they do.",bg:"#F3F2ED",fg:"#22231F",...INK,i:"d",r:"Threshold and sale buying happens at checkout, so ReuseFlex nudges there with the item you already own.",c:["Adds items to the cart to reach the free-delivery threshold","Buys during sales and festival offers, even with no need","Watches hauls and unboxings, then shops soon after","Skips repair and second-hand, replaces working products","Splits payments (EMI, BNPL) so the price feels smaller","Posts new purchases, not old ones"]},
{k:"04 — What they feel",tab:"Feels",t:"What they feel.",bg:"#CBBEE9",fg:"#22231F",...INK,i:"f",r:"Buying brings guilt later, so the life counter turns keeping things into a good feeling.",c:["Anxious about being judged or left out","Excited while buying, then quick guilt or regret","Pressured by trend speed and peers","Embarrassed by the idea of old, repaired or second-hand items","Overwhelmed by clutter, unused items and money spent"]},
{k:"05 — Their pains",tab:"Pains",t:"Where it hurts.",bg:"#22231E",fg:"#F4F2EA",...DARK,i:"p",r:"Clutter, wasted money and costly repair, so swap, resale and repair connect make letting go easy.",c:["Closets and drawers full of barely used things","Money wasted on impulse and threshold buys","Guilt about waste without a simple alternative","Fear of social judgment when choosing reuse","Repair being expensive, slow or hard to find"]},
{k:"06 — Their gains",tab:"Gains",t:"What they want.",bg:"#D5F560",fg:"#22231F",...INK,rac:"#D5F560",i:"g",r:"People want to belong without overspending, so the status card makes reuse something to show off.",c:["To belong and look current without overspending","Recognition for smart, stylish choices","Swap, rent and repair options that feel normal, not like a sacrifice","A sense of control over their money and habits","Feeling good about their choices, not guilty"]}
];
const $=id=>document.getElementById(id),rs=document.documentElement.style,reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
const stage=$("stage"),tabs=$("tabs"),playB=$("play"),prog=$("prog"),els=[];
let cur=0,playing=false,pa=null,lbS=0,lbJ=0,lbFrom=null;
const esc=s=>s.replace(/"/g,"&quot;");
const letters=t=>{let d=0;return t.split(" ").map(w=>`<span class="w">${[...w].map(c=>`<span class="ch" style="--d:${d++}">${c}</span>`).join("")}</span>`).join(" ")};
S.forEach((s,i)=>{
 const sec=document.createElement("section");sec.className="scene";sec.setAttribute("aria-label",s.tab);
 sec.style.cssText=`--sbg:${s.bg};--sfg:${s.fg};--rbg:${s.rbg||""};--rfg:${s.rfg||""};--rac:${s.rac||""}`;
 const imgs=s.ov?IMGS.o:IMGS[s.i];
 const cards=imgs.map((src,j)=>`<div class="card" style="--i:${j}"><button class="cbtn" type="button" data-j="${j}" aria-label="${esc(s.ov?"Explore "+s.c[j]:s.c[j])}"><span class="float" style="--fd:${(j*.55).toFixed(2)}s"><span class="tilt"><img src="${src}" alt=""><span class="glare"></span></span></span></button></div>`).join("");
 sec.innerHTML=`<div class="wrap"><div class="kick">${s.k}</div>${s.ov?"<h1>":"<h2>"}${letters(s.t)}${s.ov?"</h1>":"</h2>"}${s.ov?'<div class="pill">Aarav / Ananya · 21 · Delhi · student</div>':""}<div class="cards" style="--n:${s.ov?3:imgs.length}" data-s="${i}">${cards}</div>${s.ov?'<div class="hint">Tap a card to explore it, or play the guided tour.</div><div class="resp" style="--rbg:#22231F;--rfg:#F4F2EA;--rac:#CBF55C"><b>Insight</b><span>New purchases earn social approval and reuse risks social judgment. <em>Opportunity: make reuse the thing that earns status.</em></span></div>':`<div class="resp"><b>How ReuseFlex answers this</b><span>${s.r}</span></div>`}</div>`;
 stage.appendChild(sec);els.push(sec);
 const b=document.createElement("button");b.type="button";b.className="tab";b.textContent=s.tab;b.onclick=e=>{const r=b.getBoundingClientRect();go(i,r.left+r.width/2,r.bottom)};tabs.appendChild(b);
});
const tabEls=[...tabs.children];
function go(i,x,y){
 if(i===cur)return;
 if(x==null){x=innerWidth/2;y=innerHeight/2}
 els.forEach((e,k)=>{if(k!==cur&&k!==i)e.classList.remove("active","in")});
 const nx=els[i],pv=els[cur];nx.classList.add("active","in");nx.style.zIndex=2;pv.style.zIndex=1;nx.scrollTop=0;
 nx.animate([{clipPath:`circle(0px at ${x}px ${y}px)`},{clipPath:`circle(160vmax at ${x}px ${y}px)`}],{duration:reduce?1:850,easing:"cubic-bezier(.3,.7,.1,1)"}).onfinish=()=>{pv.classList.remove("active","in");pv.style.zIndex="";nx.style.zIndex=""};
 cur=i;rs.setProperty("--bg",S[i].bg);rs.setProperty("--fg",S[i].fg);
 tabEls.forEach((t,k)=>t.setAttribute("aria-current",k===i?"true":"false"));
 tabEls[i].scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
 if(playing)startProg();
}
function startProg(){
 stopProg();if(!playing)return;
 pa=prog.animate([{width:"0%"},{width:"100%"}],{duration:cur===0?5000:8000,easing:"linear"});
 pa.onfinish=()=>{if(cur===S.length-1){setPlaying(false);go(0)}else go(cur+1)};
}
function stopProg(){if(pa){pa.onfinish=null;pa.cancel();pa=null}}
function setPlaying(v){playing=v;playB.textContent=v?"Pause tour":"Play tour";if(v){if(cur===0)go(1);else startProg()}else stopProg()}
playB.onclick=()=>setPlaying(!playing);
rs.setProperty("--bg",S[0].bg);rs.setProperty("--fg",S[0].fg);
els[0].classList.add("active","in");tabEls[0].setAttribute("aria-current","true");
// tilt
stage.addEventListener("pointermove",e=>{
 if(e.pointerType!=="mouse")return;const b=e.target.closest(".cbtn");if(!b)return;
 const t=b.querySelector(".tilt"),r=b.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
 t.style.setProperty("--rx",((.5-py)*12).toFixed(1)+"deg");t.style.setProperty("--ry",((px-.5)*12).toFixed(1)+"deg");t.style.setProperty("--sc","1.05");t.style.setProperty("--mx",px*100+"%");t.style.setProperty("--my",py*100+"%");
});
stage.addEventListener("pointerout",e=>{const b=e.target.closest(".cbtn");if(!b||b.contains(e.relatedTarget))return;const t=b.querySelector(".tilt");["--rx","--ry","--sc"].forEach(p=>t.style.removeProperty(p))});
// click card
stage.addEventListener("click",e=>{
 const b=e.target.closest(".cbtn");if(!b)return;const si=+b.closest(".cards").dataset.s,j=+b.dataset.j;
 if(S[si].ov){go(j+1,e.clientX,e.clientY)}else openLb(si,j,b);
});
function openLb(si,j,from){
 lbS=si;lbJ=j;if(from)lbFrom=from;const s=S[si],lb=$("lb");
 $("lbimg").src=IMGS[s.i][j];$("lbimg").alt=s.c[j];$("lbcap").textContent=s.c[j]+"  ("+(j+1)+" of "+s.c.length+")";
 if(lb.hidden){lb.hidden=false;if(pa)pa.pause();$("lbx").focus();lb.querySelector(".lbin").animate([{opacity:0,transform:"scale(.8)"},{opacity:1,transform:"none"}],{duration:reduce?1:350,easing:"cubic-bezier(.2,1.2,.4,1)"})}
}
function closeLb(){$("lb").hidden=true;if(pa&&playing)pa.play();if(lbFrom)lbFrom.focus()}
const lbStep=d=>{const n=S[lbS].c.length;openLb(lbS,(lbJ+d+n)%n)};
$("lbp").onclick=()=>lbStep(-1);$("lbn").onclick=()=>lbStep(1);$("lbx").onclick=closeLb;
$("lb").addEventListener("click",e=>{if(e.target.id==="lb")closeLb()});
addEventListener("keydown",e=>{
 const open=!$("lb").hidden;
 if(e.key==="Escape"&&open)closeLb();
 else if(e.key==="ArrowRight")open?lbStep(1):go((cur+1)%S.length);
 else if(e.key==="ArrowLeft")open?lbStep(-1):go((cur-1+S.length)%S.length);
});
// swipe
let sx=null;
stage.addEventListener("pointerdown",e=>{if(e.pointerType==="touch")sx=e.clientX});
stage.addEventListener("pointerup",e=>{if(sx==null)return;const d=e.clientX-sx;sx=null;if(Math.abs(d)>80)go(d<0?Math.min(cur+1,S.length-1):Math.max(cur-1,0))});
</script>
